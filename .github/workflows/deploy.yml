name: Deployment (Container)
on:
  push:
    branches:
      - main
      - dev
env:
  CACHE_KEY: node-deps
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    container: 
      image: node:20
    env:
      #MONGODB_CONNECTION_PROTOCOL: mongodb+srv
      #MONGODB_CLUSTER_ADDRESS: cluster0.oj4wbe4.mongodb.net
      #MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      #MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      #MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_URI: mongodb://root:example@mongodb:27017/gha-demo?authSource=admin
      PORT: 3000
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example      

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Validate MongoDB URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node -e "const uri = process.env.MONGODB_URI || ''; if (!/^mongodb(\+srv)?:\/\/.+\.[a-z0-9.-]+\.[a-z]{2,}.*$/i.test(uri)) { console.error('Invalid MONGODB_URI secret. Expected a MongoDB Atlas URI like mongodb+srv://user:password@cluster0.oj4wbe4.mongodb.net/?retryWrites=true&w=majority'); process.exit(1); } console.log('MONGODB_URI format looks valid.');"
      
      - name: Run server
        run: |
          npm start > server.log 2>&1 &
          server_pid=$!
          if ! npx wait-on --timeout 30000 http://127.0.0.1:$PORT; then
            cat server.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
      
      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          PORT: 3000
        run: |        
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          echo "${{ env.PORT }}"
